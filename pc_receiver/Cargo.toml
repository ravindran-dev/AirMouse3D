[package]
name = "pc_receiver"
version = "1.0.0"
edition = "2021"
description = "AirMouse3D Receiver — use your phone as a wireless mouse"

[[bin]]
name = "AirMouse3D-Receiver"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = "0.2"
qrcode = "0.13"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }

# Windows-only: bake the procedural icon into the exe (taskbar / file-explorer / Task Manager)
# and stamp product metadata. Kept target-gated so non-Windows builds don't pull them.
[target.'cfg(windows)'.build-dependencies]
ico = "0.3"
winresource = "0.1"
